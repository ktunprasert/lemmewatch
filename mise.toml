[tools]
go = "1.27.0"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.build]
description = "Build lemmewatch"
run = """go build -trimpath -ldflags "-X lemmewatch/internal/buildinfo.Commit=$(git describe --always --dirty)" ./cmd/lemmewatch"""

[tasks.build-darwin-arm64]
description = "Cross-compile lemmewatch for Apple Silicon"
run = """CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-X lemmewatch/internal/buildinfo.Commit=$(git describe --always --dirty)" -o dist/lemmewatch-darwin-arm64 ./cmd/lemmewatch"""

[tasks.build-windows-amd64]
description = "Cross-compile Windows x64 app and Explorer launcher"
run = '''
mkdir -p dist
CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X lemmewatch/internal/buildinfo.Commit=$(git describe --always --dirty)" -o dist/lemmewatch.exe ./cmd/lemmewatch
CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui" -o dist/lemmewatch-launcher.exe ./cmd/launcher
'''

[tasks.check]
description = "Format, vet, test, and build"
run = [
  "gofmt -w .",
  "go vet ./...",
  "go test -race ./...",
  "go build -trimpath -ldflags \"-X lemmewatch/internal/buildinfo.Commit=$(git describe --always --dirty)\" ./cmd/lemmewatch",
]

[tasks.run]
description = "Run lemmewatch"
run = "go run ./cmd/lemmewatch --"
